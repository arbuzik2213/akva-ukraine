name: Build & Release AquaAlert UA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Split-per-ABI APKs (Optimized file size)
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Build Android App Bundle (AAB for Google Play)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: akva-ukraine-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Split ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: akva-ukraine-split-apks
          path: build/app/outputs/flutter-apk/app-*.apk

      - name: Upload Android App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: akva-ukraine-app-bundle
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS Runner
    runs-on: macos-13
    needs: build-android

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign for CI check)
        run: flutter build ios --release --no-codesign
